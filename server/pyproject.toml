[project]
name = "nvai-server"
version = "0.5.0b1"
description = "Local NVIDIA GPU asset generation server (images + 3D) with MCP bridge for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
    "huggingface-hub>=0.26",
    "mcp>=1.2",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nvai"]
