# XcodeGen-Spezifikation für „NVAI-open für Mac“.
# Auf dem Mac:  ~/tools/xcodegen/bin/xcodegen generate   (siehe scripts/build.sh)
# Gebaut wird mit xcodebuild, nicht mit swift build: MLX braucht seine Metal-Shader,
# und die übersetzt nur Xcode (dazu die Metal Toolchain: xcodebuild -downloadComponent MetalToolchain).
name: NVAIMac
options:
  bundleIdPrefix: com.noerr
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Flux2:
    # FLUX.2 Klein auf MLX (MIT), lokale Kopie von 3.1.0 mit Abbruchprüfung nach jedem Schritt
    # (Packages/flux-2-swift-mlx/NVAI-OPEN-CHANGES.md); mlx-swift ist darin exakt gepinnt.
    path: Packages/flux-2-swift-mlx
  SeedVR2:
    # SeedVR2 3B auf MLX (Port MIT, Gewichte Apache-2.0), lokale Kopie des archivierten seedvr2-mlx-swift
    # (Packages/seedvr2-mlx-swift/NVAI-OPEN-CHANGES.md); mlx-swift wie bei Flux2.
    path: Packages/seedvr2-mlx-swift
  StableAudio3:
    # Stable Audio 3 Medium auf MLX (aus speech-swift, Apache-2.0; Packages/stable-audio-3-swift/NVAI-OPEN-CHANGES.md).
    path: Packages/stable-audio-3-swift
  StableDiffusion:
    # Core ML Stable Diffusion für kleine Macs und die Modellsuche, wie in NVAILocal.
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"

targets:
  NVAIMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Third-Party-Notices.txt
        buildPhase: resources
    dependencies:
      - package: Flux2
        product: Flux2Core
      - package: Flux2
        product: Flux2Chains
      - package: SeedVR2
        product: SeedVR2MLX
      - package: StableAudio3
        product: StableAudio3
      - package: StableDiffusion
        product: StableDiffusion
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: NVAI-open
        PRODUCT_MODULE_NAME: NVAIMac
        PRODUCT_BUNDLE_IDENTIFIER: com.noerr.nvai.mac
        MARKETING_VERSION: "0.4.7"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/NVAIMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_ENABLE_CODE_COVERAGE: NO
        DEAD_CODE_STRIPPING: YES
